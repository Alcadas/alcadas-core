<main class="auth">
  <div class="blob" aria-hidden="true"></div>
  <div class="blob-soft" aria-hidden="true"></div>

  <section class="card">
    <header class="brand">
      <img
        src="logoV.png"
        alt="Alçadas"
        style="display:block; width:150px; max-width:100%; height:auto; margin:0 auto;"
      />
      </header>

    <h1>Criar uma conta</h1>
    <p class="sub">Já tem conta? <a routerLink="/login">Fazer login</a></p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input
          id="nome"
          type="text"
          formControlName="nome"
          autocomplete="name"
          [class.invalido]="mostrarErro('nome')"
        />
        <span class="erro" *ngIf="mostrarErro('nome')">Informe seu nome completo.</span>
      </div>

      <div class="campo">
        <label for="email">E-mail corporativo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.invalido]="mostrarErro('email')"
        />
        <span class="erro" *ngIf="mostrarErro('email')">Informe um e-mail válido.</span>
      </div>

     <div class="campo">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          autocomplete="new-password"
          [class.invalido]="mostrarErro('senha')"
        />
        <span class="erro" *ngIf="mostrarErro('senha')">A senha deve ter no mínimo 8 caracteres.</span>
      </div>

      <button class="botao" type="submit" [disabled]="form.invalid || carregando">
        Criar conta
      </button>
    </form>
  </section>
</main>

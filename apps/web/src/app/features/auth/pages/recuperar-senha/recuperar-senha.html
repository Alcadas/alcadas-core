<main class="auth">
  <div class="blob" aria-hidden="true"></div>
  <div class="blob-soft" aria-hidden="true"></div>

  <section class="card">
    <header class="brand">
      <img src="logoV.png" alt="Alçadas" />
    </header>

    <h1>Recuperar senha</h1>
    <p class="sub">
      Informe o e-mail da sua conta. Vamos enviar um código de 6 dígitos para você criar uma nova senha.
    </p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="voce@empresa.com"
          [class.invalido]="emailInvalido || !!erro()"
          (input)="erro.set('')"
        />
        @if (emailInvalido) {
          <span class="erro" role="alert">Informe um e-mail válido.</span>
        } @else if (erro()) {
          <span class="erro" role="alert">{{ erro() }}</span>
        }
      </div>

      <button class="botao" type="submit">Enviar código</button>
    </form>

    <p class="voltar">Lembrou a senha? <a routerLink="/login">Voltar ao login</a></p>
  </section>
</main>

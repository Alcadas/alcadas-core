version: '3.8'

services:
  api:
    image: node:24-alpine
    container_name: alcadas-api
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx nx serve api --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  web:
    image: node:24-alpine
    container_name: alcadas-web
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx nx serve web --host 0.0.0.0"
    depends_on:
      - api